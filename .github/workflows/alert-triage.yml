name: Alert triage — correlate & commit brief

# Fuses the committed real-time hazard feeds (data/realtime/) with the
# precomputed score tile (data/scores/) into a ranked situational brief per
# region, committed to data/triage/<region>/{latest.json,brief.md} so the
# frontend / stakeholders always see current, prioritized hazards.
#
# Runs a few minutes after the 15-min scrape cadence so it reads fresh feeds.
# Pure standard library — no pip install needed. Manual dispatch enabled.

on:
  schedule:
    - cron: "20 */3 * * *"   # every 3 hours, offset from the scrapers
  workflow_dispatch:
    inputs:
      region:
        description: "Region id (default: indore_pilot)"
        required: false
        default: "indore_pilot"

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build situational brief
        env:
          DIGIPIN_REGION: ${{ github.event.inputs.region || 'indore_pilot' }}
          # Optional: POST the JSON brief to a webhook. Unset → skipped cleanly.
          TRIAGE_WEBHOOK_URL: ${{ secrets.TRIAGE_WEBHOOK_URL }}
        run: python -m pipeline.triage

      - name: Commit refreshed brief
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/triage
          if ! git diff --staged --quiet; then
            git commit -m "chore(triage): refresh situational brief"
            git push
          else
            echo "No changes to commit."
          fi
