name: Precompute scores

# Regenerates a precomputed score tile the app reads (data/scores/) from a
# fresh OSM extract, so cells render instantly with zero per-click upstream
# calls. Runs monthly and on demand. Mirrors realtime-scrape.yml: a smoke check
# gates the commit, so bad data never ships, and the result is committed back to
# the branch for Pages to serve atomically with the code.
#
# Region-driven: every per-region input (Geofabrik extract, clip bbox, DEM
# tiles) is resolved from pipeline/_lib/regions.py, and the job runs
# pipeline/scores/build_cities.py, which groups cities by Geofabrik zone so each
# ~1 GB extract downloads once. Push/cron runs rebuild every registered city;
# `workflow_dispatch` takes 'all' or a space-separated subset. Adding a NEW
# city is one registry entry — no YAML edits. See docs/PRECOMPUTE_PHASE1.md.
#
# Elevation comes from the public Copernicus GLO-30 DEM (no auth) so flood-risk
# uses real terrain (multiple 1°×1° tiles are mosaicked with rasterio); if
# the download fails the tile builds OSM-only. Population (GHSL GHS-POP) still
# needs a one-time GEE export hosted as an asset, then --pop wires it in; until
# then population_proxy uses its building-density fallback.

on:
  # Auto-build when the scoring code lands on main (e.g. merging the spine PR):
  # path-filtered to code only, so the job's own data/scores/ commit cannot
  # retrigger it (GITHUB_TOKEN pushes also don't recurse — belt and braces).
  push:
    branches: [main]
    paths:
      - 'pipeline/scores/**'
      - 'pipeline/_lib/**'
      - '.github/workflows/precompute-scores.yml'
  schedule:
    - cron: "17 2 3 * *"     # 02:17 UTC on the 3rd of each month
  workflow_dispatch:
    inputs:
      region:
        description: "Region(s): 'all', or space-separated names from pipeline/_lib/regions.py CITY_PILOTS"
        default: all
      level:
        description: "DIGIPIN level (6 ~244m, 7 ~61m)"
        default: "6"

permissions:
  contents: write

concurrency:
  group: precompute-scores
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 8 cities across 4 Geofabrik zones: ~4 zonal downloads + 8 builds.
    timeout-minutes: 150
    env:
      PYTHONPATH: .
      # Push/cron runs rebuild every registered city so all tiles stay fresh.
      REGION: ${{ github.event.inputs.region || 'all' }}
      LEVEL: ${{ github.event.inputs.level || '6' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Install pipeline deps
        run: pip install -r pipeline/scores/requirements.txt

      - name: Build + smoke-check tiles (grouped by Geofabrik zone)
        # build_cities downloads each zonal extract once, clips every city in it,
        # fetches + mosaics its GLO-30 DEM tiles (OSM-only fallback if the DEM is
        # unavailable), builds JSON shards + PMTiles, and smoke-checks each tile.
        # Exits non-zero if any requested city failed, which gates the commit.
        run: |
          if [ "$REGION" = "all" ]; then ARGS=""; else ARGS="$REGION"; fi
          python -m pipeline.scores.build_cities $ARGS --level "$LEVEL" --out data/scores

      - name: Mirror scores into the per-cell data store (docs/CELL_STORE.md)
        run: |
          pip install -r pipeline/cells/requirements.txt
          for r in $(python -c "import json; print(' '.join(x['name'] for x in json.load(open('data/scores/coverage.json'))['regions']))"); do
            python -m pipeline.cells.build --region "$r" scores
          done
          python -m pipeline.cells.coverage --write

      - name: Commit refreshed tiles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scores/ data/cells/ docs/CELL_STORE.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(scores): refresh $REGION tiles (level $LEVEL)"
            # The build is long; rebase over anything pushed meanwhile.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes to commit."
          fi
