name: Open data cells

# Bakes open datasets into the per-DIGIPIN-cell store (data/cells/, see
# docs/CELL_STORE.md) for every registered metro and commits them back to the
# branch it runs on.
#
#   osm  pipeline/cells/osm_layers.py — Geofabrik extracts → osm_amenities, osm_roads
#   ee   pipeline/cells/ee_layers.py  — Earth Engine rasters → population, land cover,
#        NDVI, terrain, water/flood, night lights, LST, air quality, rainfall …
#        Needs the GEE_SERVICE_ACCOUNT_KEY secret (service-account key JSON with
#        Earth Engine access on GEE_PROJECT); skipped with a notice when it is unset.

on:
  # Re-bake when the bakers change on dev (GITHUB_TOKEN pushes don't retrigger).
  push:
    branches: [dev]
    paths:
      - 'pipeline/cells/osm_layers.py'
      - 'pipeline/cells/ee_layers.py'
      - 'pipeline/cells/earthengine.py'
      - '.github/workflows/open-data-cells.yml'
  schedule:
    - cron: "41 3 7 * *"     # 03:41 UTC on the 7th of each month
  workflow_dispatch:
    inputs:
      sources:
        description: "osm, ee, or 'osm ee'"
        default: "osm"
      region:
        description: "'all' or a comma list (indore_pilot,bhopal,pune,mumbai,bengaluru,hyderabad,chennai,delhi)"
        default: all
      layers:
        description: "ee only: space-separated layer ids (blank = all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: open-data-cells
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      SOURCES: ${{ github.event.inputs.sources || 'osm ee' }}
      REGION: ${{ github.event.inputs.region || 'all' }}
      LAYERS: ${{ github.event.inputs.layers || '' }}
      GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
      GEE_PROJECT: ${{ vars.GEE_PROJECT || 'van-suraksha-alert' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -r pipeline/cells/requirements.txt osmium earthengine-api numpy pytest
          if [[ " $SOURCES " == *" osm "* ]]; then
            sudo apt-get update && sudo apt-get install -y osmium-tool
          fi

      - name: OSM amenities + roads
        if: contains(env.SOURCES, 'osm')
        run: python -m pipeline.cells.osm_layers --region "$REGION"

      - name: Earth Engine rasters
        if: contains(env.SOURCES, 'ee')
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::notice::GEE_SERVICE_ACCOUNT_KEY is not set; skipping Earth Engine layers"
            exit 0
          fi
          python -m pipeline.cells.ee_layers --region "$REGION" $LAYERS

      - name: Check the store still loads
        run: python -m pytest -q pipeline/cells

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cells/
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git commit -m "chore(cells): bake open data ($SOURCES, $REGION)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
