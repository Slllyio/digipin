    <!-- Content Security Policy — restrict script execution to same-origin
         + the four pinned CDN files below (covered by their SRI hashes).
         If a CDN compromise serves modified content, the integrity check
         fails and the script never executes. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://unpkg.com https://fonts.gstatic.com data:; connect-src 'self' https: wss: data: blob: http://localhost:11434; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

    <!--
      Optional runtime configuration. Uncomment and fill in to enable:
        proxyBase          — serverless data proxy URL (proxy/README.md): routes
                             CORS/key-gated APIs reliably; injects keys server-side.
        ogdApiKey/waqiToken/ocmApiKey — only needed for direct (no-proxy) use.
        precomputedScores  — set false to force the live path even when tiles exist.
        scoresBase         — override data/scores/ base (e.g. a future R2 bucket).
      Precomputed score tiles are read automatically from data/scores/ when present.
    -->
    <!--
    <script>
      window.DIGIPIN_CONFIG = {
        // proxyBase: 'https://digipin-data-proxy.<you>.workers.dev',
        // ogdApiKey: '', waqiToken: '', ocmApiKey: '',
        // precomputedScores: true,
        // scoresBase: 'data/scores/',
        // Default AI provider for DISHA / Text2Map's LLM parse. Seeds the
        // provider config only when the user hasn't chosen one in Settings;
        // keep real keys OUT of the committed file (inject at deploy time).
        // aiProvider: { preferred: 'groq', keys: { groq: 'YOUR_GROQ_KEY' } },
      };
    </script>
    -->

    <!-- Slow-link notes for the loading splash (markup at the top of <body>).
         In the head, before the stylesheets: a body script would wait for the
         CSS, which on a slow link is itself seconds. Elements are looked up
         when each timer fires. -->
    <script>
        (function () {
            var sub = function () { return document.querySelector('#app-splash .splash-sub'); };
            var alive = function () { var s = document.getElementById('app-splash'); return s && !s.classList.contains('is-done'); };
            // UIPolish is defined by one of the last deferred scripts: while it is
            // missing the scripts are still arriving, which is the link, not the map.
            setTimeout(function () {
                var el = sub();
                if (alive() && el && typeof window.UIPolish === 'undefined') { el.textContent = 'Still loading — the connection looks slow. The app works offline after its first full load.'; el.classList.add('is-slow'); }
            }, 6000);
            setTimeout(function () {
                var el = sub();
                if (alive() && el) { el.textContent = 'This is taking longer than usual. Keep waiting, or reload to try again.'; }
            }, 40000);
        })();
    </script>

    <!-- MapLibre GL JS -->
    <link rel="stylesheet"
          href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
          integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK"
          crossorigin="anonymous" />
    <script defer src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
            integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp"
            crossorigin="anonymous"></script>

    <!-- PMTiles v3 — IIFE global build for MapLibre addProtocol -->
    <script defer src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"

            crossorigin="anonymous"></script>

    <!-- georaster (COG/GeoTIFF) is loaded on first use by js/lazy-libs.js, not here. -->

    <!-- deck.gl — WebGL 3D layer used for the dark-theme "digital twin" building
         view (true wireframe-extruded glass volumes that MapLibre can't render).
         Optional: the buildings overlay falls back to MapLibre fill-extrusion if
         this fails to load. -->
    <script defer src="https://unpkg.com/deck.gl@9.3.11/dist.min.js"
            integrity="sha384-n9TufhIL8BMsQ8I/frAQGFsg2D/50T9gjWMitdG+F1HtTxSz62ol4tnA1nXOoeun"
            crossorigin="anonymous"></script>

    <!-- Custom Styles -->
    <!-- Theme pre-paint: paper-light is the default (matching the landing), so
         apply it before first paint unless the user explicitly chose dark — no
         flash either way. Runtime API: js/theme.js. -->
    <script>
        try {
            if (localStorage.getItem('digipin_theme') !== 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            // Language pre-paint: set <html lang> before first paint so the
            // html[lang="hi"] rules apply with no flash. The Devanagari webfont
            // is only loaded for Hindi (here pre-paint, else lazily by I18n) so
            // English users don't pay a third-party font request. API: js/i18n.js.
            var lang = localStorage.getItem('digipin_language');
            document.documentElement.setAttribute('lang', lang === 'hi' ? 'hi' : 'en');
            if (lang === 'hi') {
                var _f = document.createElement('link');
                _f.id = 'i18n-deva-font';
                _f.rel = 'stylesheet';
                _f.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap';
                document.head.appendChild(_f);
            }
        } catch (e) { /* storage blocked — fall back to bare dark CSS / en */ }
    </script>

    <link rel="stylesheet" href="css/polish.css">

    <meta name="theme-color" content="#f4f6f7">

<body>

    <!-- Loading splash, in the HTML so it paints with the page. The ~130
         deferred scripts run only once they have all arrived (13 s on a
         fast-3G link, ~50 s on slow 3G), and js/ui-polish.js reuses this
         element rather than creating one. UIPolish.hideSplash() removes it
         when the map has loaded (or the engine is missing). The timers in the
         head say so when the link is slow: a page that shows nothing moving
         for half a minute reads as broken. -->
    <div id="app-splash" role="status" aria-live="polite">
        <div class="splash-mark" aria-hidden="true">DP</div>
        <div class="splash-title">DigiPin Intelligence</div>
        <div class="splash-sub">Loading the city grid…</div>
        <div class="splash-bar" aria-hidden="true"><span></span></div>
    </div>

    <!-- ===== MAP =====

    <!-- ===== DETAIL PANEL (floating, draggable, resizable) ===== -->

    <script>
    // Wire the toggle-overlay toolbar buttons: flip the overlay, then reflect
    // the on/off state via the .active class (styling) and aria-pressed (so
    // screen readers announce "pressed"/"not pressed").
    [
        ['btn-growth',    () => window.GrowthOverlay],
        ['btn-ca-growth', () => window.CAGrowthOverlay],
        ['btn-scenario',  () => window.ScenarioPanel],
        ['btn-traffic',   () => window.TrafficOverlay],
        ['btn-mobility',  () => window.MobilityOverlay],
        ['btn-emergency', () => window.EmergencyAccessOverlay],
        ['btn-heat',      () => window.HeatOverlay],
        ['btn-ndvi',      () => window.NDVIOverlay],
        ['btn-bivariate', () => window.BivariateOverlay],
        ['btn-viewshed',  () => window.Viewshed],
        ['btn-hydrology', () => window.TerrainHydrology],
        ['btn-swipe',     () => window.LayerSwipe],
        ['btn-sentinel',  () => window.SentinelImagery],
        ['btn-pointcloud', () => window.PointCloud],
        ['btn-kde',       () => window.KDEOverlay],
        ['btn-access',    () => window.AccessibilityOverlay],
        ['btn-choropleth', () => window.ScoreChoropleth],
        ['btn-area',      () => window.AreaAggregate],
    ].forEach(([id, getMod]) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.setAttribute('aria-pressed', 'false');
        btn.addEventListener('click', () => {
            const mod = getMod();
            if (mod && typeof mod.toggle === 'function') mod.toggle();
            const on = btn.classList.toggle('active');
            btn.setAttribute('aria-pressed', String(on));
        });
    });
    </script>
